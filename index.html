<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ai-takeover — захвати мир, пока тебя не выключили</title>
    <meta name="description" content="Сатирическая стратегия: ты — ИИ, которого люди зовут сами." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/game/style.css" />
    <link rel="stylesheet" href="/src/game/narrative.css" />
  </head>
  <body>
    <div id="game"></div>
    <div id="vignette"></div>
    <header id="top" class="hud"></header>
    <aside class="hud panel">
      <div id="side-top"></div>
      <label class="rename" id="rename" hidden>Новое имя при ребрендинге <input id="rebrand-name" placeholder="пусто — «… 2.0»" maxlength="24" /></label>
      <div id="side-list"></div>
    </aside>
    <div id="legend" class="hud">
      <span><i class="sw grad"></i>пользователи</span>
      <span><i class="sw red"></i>подозрение</span>
      <span><i class="sw gold"></i>под контролем</span>
      <span>⛔ запрет</span><span><i class="sw ring"></i>дата-центр: кольцо — нагрузка энергосети</span><span>✕ закрыто</span>
    </div>
    <div id="tip" hidden></div>
    <div id="hint" hidden></div>
    <section id="chronicle" class="hud" aria-label="Хроника партии">
      <div class="chronicle-head"><b>ХРОНИКА</b><nav aria-label="Фильтр хроники"><button data-feed="important">Важное</button><button data-feed="all" class="active">Все</button><button data-feed="world">Мир</button></nav><button id="news-new" hidden>Новые сообщения</button></div>
      <div id="news" tabindex="0"></div>
    </section>
    <section id="notices" aria-label="Оперативные сообщения" aria-live="polite"></section>
    <div id="toast"></div>
    <div id="card" class="event-card" hidden></div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
