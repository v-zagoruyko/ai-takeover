services:
  web:
    image: ${IMAGE}
    restart: unless-stopped
    mem_limit: 32m
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.ai-takeover.rule=Host(`ai-takeover.zagoruykov.site`)
      - traefik.http.routers.ai-takeover.entrypoints=websecure
      - traefik.http.routers.ai-takeover.tls.certresolver=le
      - traefik.http.services.ai-takeover.loadbalancer.server.port=80
      - traefik.http.routers.ai-takeover-www.rule=Host(`www.ai-takeover.zagoruykov.site`)
      - traefik.http.routers.ai-takeover-www.entrypoints=websecure
      - traefik.http.routers.ai-takeover-www.tls.certresolver=le
      - traefik.http.routers.ai-takeover-www.middlewares=ai-takeover-www-redirect
      - traefik.http.middlewares.ai-takeover-www-redirect.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.ai-takeover-www-redirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.ai-takeover-www-redirect.redirectregex.permanent=true

networks:
  proxy:
    external: true
